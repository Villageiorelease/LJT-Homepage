name: Build check (temporary)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify key pages and content
        run: |
          set -e
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/cv/index.html
          test "$(find _site/publication -name '*.html' | wc -l)" -eq 6
          grep -q "SynLogic" _site/index.html
          grep -q "On the Perception Bottleneck of VLMs for Chart Understanding" _site/index.html
          grep -q "Universal Truthfulness Hyperplane" _site/index.html
          grep -q "In-Context Sharpness as Alerts" _site/index.html
          grep -q "C-Eval" _site/index.html
          grep -q "Composing Parameter-Efficient Modules" _site/index.html
          grep -q "Zhiyuan Honor Scholarship" _site/index.html
          grep -q "jliugi@connect.ust.hk" _site/index.html
          grep -q "Vicent0205" _site/index.html
          grep -q "junteng88716710" _site/index.html
          grep -q "Research Intern" _site/index.html
          grep -q "MINIMAX" _site/index.html
          grep -q "Tencent WXG" _site/index.html
          grep -q "Shanghai AI Lab" _site/index.html
          grep -q "Previously advised by Professor Junxian He" _site/index.html
          echo "ALL CONTENT CHECKS PASSED"
