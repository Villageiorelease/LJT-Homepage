og_description: "Junteng Liu is a first-year PhD candidate in the HKUST NLP Group working on natural language processing and machine learning."

atom_feed:
  hide: false
  path:

comments:
  provider:

# Social profiles
twitter:
  username: "junteng88716710"
facebook:
  username:
app_id:
publisher:

social:
  type: "Person"
  name: "Junteng Liu"
  links:
    - "https://github.com/Vicent0205"
